<h1>Inserisci prodotto</h1>

<div class="form-group">
  <label>Nome</label>
  <input type="text" [(ngModel)]="input_nome" class="form-control" />
</div>
<div class="form-group">
  <label>Quantità</label>
  <input type="number" [(ngModel)]="input_quantita" class="form-control" />
</div>

<button (click)="aggiungi()" class="btn btn-primary">Aggiungi prodotto</button>

<h1>Lista prodotti</h1>

<table class="table table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Nome</th>
      <th>Quantità</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for(p of elenco(); track p.id){
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nome }}</td>
        <td>{{ p.quantita }}</td>
        <td>
          <button type="button" class="btn" (click)="incrementa(p.id)">+</button>
        </td>
      </tr>
    }
  </tbody>
</table>
